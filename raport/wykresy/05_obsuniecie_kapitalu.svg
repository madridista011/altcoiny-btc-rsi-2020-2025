   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #66758a" transform="translate(65.52 450.718594)">MDD = najniższa wartość (kapitał / wcześniejsze maksimum − 1). Głębszy spadek oznacza większe ryzyko.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #66758a" transform="translate(65.52 463.388203)">Wyceny: kapitał początkowy, wejście, dzienne zamknięcia i wpływ netto ze sprzedaży; modelowe koszty.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #66758a" transform="translate(65.52 476.057813)">Najgorsze zdarzenie może być inne dla koszyka i BTC. Nie jest to ścieżka jednego konta w latach 2020–2025.</text>
  </g>
  <g id="text_42">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #66758a" x="65.52" y="491.4" transform="rotate(-0 65.52 491.4)">Opracowanie własne · ceny: Binance / KuCoin · Data: CryptWatch, based on CoinMarketCap</text>
  </g>
