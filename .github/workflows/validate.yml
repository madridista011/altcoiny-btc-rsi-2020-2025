name: Kontrola analizy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Zainstaluj zależności analizy
        run: python -m pip install -r requirements.txt
      - name: Przelicz wyniki i uruchom testy
        run: python scripts/run_analysis.py
      - name: Zbuduj stronę
        run: python scripts/build_site.py
